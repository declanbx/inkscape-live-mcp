[project]
name = "inkscape-live-mcp"
version = "0.1.0"
description = "MCP server that drives the Inkscape window you are working in, live, with exact layout by numbers (macOS)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Declan Brennan" }]
keywords = ["inkscape", "mcp", "svg", "layout", "claude"]
classifiers = ["Operating System :: MacOS", "Programming Language :: Python :: 3", "Topic :: Multimedia :: Graphics :: Editors :: Vector-Based"]
# Installed by install.sh into .venv (uv pip install -r pyproject.toml); the server runs from the
# checkout (run_server.py), which also holds launch.sh and the Inkscape extension it needs.
dependencies = [
  "mcp>=2.3,<3",
  "jeepney>=0.8",
  "lxml>=5",
  "pillow>=10",
  "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://github.com/declanbx/inkscape-live-mcp"
